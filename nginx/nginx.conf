# ==============================================================================
# Kannur City Police Sports Facilities Management System
# On-Premise Nginx Reverse Proxy & Static Frontend Server
# ==============================================================================

upstream kcp_backend_upstream {
    server backend:4000;
    keepalive 32;
}

server {
    listen 80;
    server_name sports.kannurpolice.kerala.gov.in localhost _;

    root /usr/share/nginx/html;
    index index.html;

    # Maximum upload/request payload size aligned with Express JSON limit
    client_max_body_size 5m;

    # On-Premise HTTP Hardening Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --------------------------------------------------------------------------
    # Backend API Proxy (/api/* -> Express Server Container)
    # Preserves HTTP-only kcp_session cookies & client IP headers
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://kcp_backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_pass_header Set-Cookie;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Static Vite Asset Caching
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React Router SPA Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}

